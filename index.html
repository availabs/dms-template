<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%VITE_DMS_FAVICON%" />
    <!-- Start the DNS+TCP+TLS handshake to these third-party origins immediately,
      in parallel with the rest of parsing, instead of only once the parser
      reaches the tags below that actually use them (the CDN Tailwind script,
      the Google Fonts CSS, and the font files it references from a separate
      origin). Mitigates occasional latency spikes from these external
      dependencies without changing what's loaded. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Moved up from the end of <body> and given `defer`: previously the
      browser didn't even start downloading this until the entire rest of
      the document (including the full SSR-rendered page) had been parsed,
      so it couldn't scan+apply runtime theme classes (e.g. arbitrary-value
      classes like bg-[var(--t-cobalt)] built via JS template literals,
      which the build-time Tailwind compiler can't see) until several
      hundred ms after first paint — a visible flash as those classes
      resolved late. `defer` starts the fetch as soon as the parser reaches
      this tag (in parallel with the rest of parsing) while still running
      only after the full DOM exists to scan, same as before.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');
    </style>
    <link href="/fonts/proxima-nova/stylesheet.css" rel="stylesheet">
    <link href="/fonts/font-awesome-6/css/all.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_DMS_TITLE%</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
