<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PPDAF Final Report v1 · SP-20-03 · NYSDOT × AVAIL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    /* ──────────────────────────────────────────────────────────────────
       TransportNY design-system v2 surface utilities.
       Inlined (not linked) so this file opens standalone from the file
       system and survives export to .docx. Values copied verbatim from
       ../design-system/_shared.css — do not diverge.
       ────────────────────────────────────────────────────────────────── */
    .font-display, .font-oswald { font-family: "Oswald", "Bebas Neue", sans-serif; }
    .font-proxima { font-family: "Source Sans 3", system-ui, sans-serif; }
    body { font-family: "Source Sans 3", system-ui, sans-serif; background: #ECEEF2; }
    .tny-pane      { background: #ECEEF2; }
    .tny-pane-tint { background: #E4E8EE; }
    .tny-card {
      background: #fff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 0 rgba(15, 23, 42, 0.02);
    }
    .tny-card-tint { background: #FAFBFC; }
    .tny-card-bone { background: #F5F1E8; }
    .tny-card-ink  { background: #0F2D4D; color: #fff; }
    .tny-link      { color: #1F3F8F; text-decoration: underline; text-underline-offset: 2px; }
    .tny-link:hover{ color: #16307A; }
    .tny-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em; padding: 1px 5px;
      background: rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 3px; color: #37576B; white-space: nowrap;
    }
    .tny-hero-topo {
      background:
        radial-gradient(circle at 25% 30%, rgba(15, 23, 42, 0.04), transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(15, 23, 42, 0.05), transparent 50%),
        repeating-linear-gradient(28deg, transparent 0 30px, rgba(15, 23, 42, 0.035) 30px 31px, transparent 31px 60px),
        repeating-linear-gradient(-30deg, transparent 0 36px, rgba(15, 23, 42, 0.028) 36px 37px, transparent 37px 70px),
        #EEF1F3;
    }
    .bar      { height: 8px; border-radius: 2px; background: #37576B; }
    .bar-warn { background: #CA8A04; }
    .bar-bad  { background: #B45309; }
    .bar-ok   { background: #10B981; }

    table.tny { border-collapse: collapse; width: 100%; }
    table.tny caption {
      caption-side: top; text-align: left; padding: 0 0 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: #64748b;
    }
    table.tny th {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
      color: #64748b; text-align: right; padding: 6px 8px;
      border-bottom: 1px solid rgba(15,23,42,0.12); white-space: nowrap; vertical-align: bottom;
    }
    table.tny th:first-child, table.tny td:first-child { text-align: left; }
    table.tny td {
      font-size: 13px; padding: 7px 8px; text-align: right;
      border-bottom: 1px solid rgba(15,23,42,0.05);
      font-variant-numeric: tabular-nums; vertical-align: top;
    }
    table.tny td.txt { text-align: left; font-variant-numeric: normal; line-height: 1.5; }
    table.tny tr:last-child td { border-bottom: none; }
    table.tny tr.total td { font-weight: 600; background: rgba(15,23,42,0.02); }

    /* prose defaults for the long narrative sections */
    .prose-tny p  { font-size: 14.5px; line-height: 1.7; color: #334155; margin-top: 0.85em; max-width: 78ch; }
    .prose-tny ul { margin-top: 0.7em; max-width: 78ch; }
    .prose-tny li { font-size: 14.5px; line-height: 1.65; color: #334155; margin-top: 0.35em;
                    padding-left: 1.1em; position: relative; }
    .prose-tny li::before { content: "—"; position: absolute; left: 0; color: #94a3b8; }
    .prose-tny strong { color: #0f1722; font-weight: 600; }

    figure.tny-fig { margin: 22px 0 0 0; }
    figure.tny-fig img {
      width: 100%; display: block; border-radius: 6px;
      border: 1px solid rgba(15,23,42,0.12);
      box-shadow: 0 2px 6px rgba(15,23,42,0.07);
      background: #fff;
    }
    figure.tny-fig figcaption {
      font-size: 12px; line-height: 1.55; color: #64748b; margin-top: 8px; max-width: 78ch;
    }
    figure.tny-fig figcaption b { color: #0f1722; font-weight: 600; }

    .kicker { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.2em; color: #CA8A04; }
    .chip   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; }

    /* Word/print: linearise, keep headings with their bodies, drop chrome. */
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .page-break { break-before: page; }
      section { break-inside: auto; }
      h1, h2, h3 { break-after: avoid; }
      figure.tny-fig, table.tny, .tny-card { break-inside: avoid; }
      .tny-hero-topo { background: #fff !important; }
    }
  </style>
</head>
