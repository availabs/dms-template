<!doctype html>
<html lang="en" data-mode="dark" data-density="cozy">
<head>
  <meta charset="utf-8">
  <title>WCDB · Sign in</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../_shared.css">
</head>
<body>

<!-- ============================================================
     LAYOUT · default — auth variant.
     NOTE: WCDB's theme.js doesn't ship an `auth` LayoutGroup variant
     explicitly. For login, we render a single `content` LayoutGroup
     with `place-content-center` added so the form lands centred
     vertically, and the inner shell is `max-w-md mx-auto` to
     constrain horizontally. The cutaway layout doesn't apply to
     auth — there's no editorial split, just a centred form on the
     page background. The active topnav state shows only the WCDB
     logo (no menu items) so the page reads as a single attentional
     surface.
     ============================================================ -->
<div data-dms-layout="default"
     class="bg-[var(--page-bg)] text-[color:var(--ink-1)] font-[family-name:var(--font-sans)]">

  <!-- ============================================================
       TOPNAV · theme.topnav.styles[0] "wcdb" — A NOTCH, NOT A BAR.
       layoutContainer1 is `fixed top-0 z-50` with NO width, so the whole
       nav shrink-wraps to its content. The page background is carried by
       each MENU container, never by the header — that is what lets the
       hero card sit beside the bar and cut up underneath it. The right
       menu closes the notch with `lg:rounded-br-[28px]`.
  
       The two 20x20 curve widgets mask the joins. They position against
       this FIXED container (no menu container is `relative`), which is
       why left-[7px]/top-[56px] lands just below the bar on the left and
       -right-[20px]/top-[8px] lands just past its right end.
       Source: wcdb_theme.js layout.options.topNav + widgets.jsx.
       ============================================================ -->
  <header class="fixed top-0 z-50">
    <div class="w-full">
      <div class="w-full h-14 flex items-center">
        <div class="flex items-center w-full h-full">

          <!-- leftMenuContainer · [NavLeftStyleWidget, Logo] -->
          <div class="flex items-center bg-[var(--page-bg)] h-14">
            <!-- NavLeftStyleWidget -->
            <div class="absolute left-[7px] top-[56px]">
              <!-- decorative -->
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M0 0L0 20C0 8.95431 8.95431 0 20 0L0 0Z" fill="var(--page-bg)"/></svg>
            </div>
            <a href="./home.html" class="items-center flex pt-1 pl-4">
              <!-- theme.logo — live theme serves /themes/wcdb/logo_white.svg -->
              <img src="../assets/logo_white.svg" alt="WCDB 90.9 FM" class="h-12 wcdb-logo-img">
            </a>
          </div>

          <!-- centerMenuContainer -->
          <div class="hidden lg:flex items-center flex-1 h-full overflow-visible gap-1 px-2 bg-[var(--page-bg)]">
            <a class="wcdb-navitem group px-1 py-2 text-[14px] font-medium text-[color:var(--ink-1)] transition-colors duration-300 ease-in-out cursor-pointer flex items-center gap-1.5" href="./schedule.html">Schedule</a>
            <a class="wcdb-navitem group px-1 py-2 text-[14px] font-medium text-[color:var(--ink-1)] transition-colors duration-300 ease-in-out cursor-pointer flex items-center gap-1.5" href="./events.html">Events</a>
            <a class="wcdb-navitem group px-1 py-2 text-[14px] font-medium text-[color:var(--ink-1)] transition-colors duration-300 ease-in-out cursor-pointer flex items-center gap-1.5" href="./station-info.html">Station Info</a>
            <a class="wcdb-navitem group px-1 py-2 text-[14px] font-medium text-[color:var(--ink-1)] transition-colors duration-300 ease-in-out cursor-pointer flex items-center gap-1.5" href="./djs.html">DJs</a>
            <a class="wcdb-navitem group px-1 py-2 text-[14px] font-medium text-[color:var(--ink-1)] transition-colors duration-300 ease-in-out cursor-pointer flex items-center gap-1.5" href="./airwaves.html">Airwaves</a>
          </div>

          <!-- rightMenuContainer · [UserMenu, ThemeModeToggle, NavRightStyleWidget]
               NOTE: wcdb_theme.js lists the toggle FIRST in its default
               rightMenu array; live wcdb.fm renders sign-in first. The site
               overrides the order, and production is what we mirror here. -->
          <div class="hidden md:flex h-full items-center pr-4 gap-2 bg-[var(--page-bg)] lg:rounded-br-[28px]">
            <!-- UserMenu — signed-out state -->
            <a href="./login.html" aria-label="Sign in" title="Sign in"
               class="inline-flex items-center justify-center size-8 rounded-full text-[var(--ink-1)] hover:bg-[var(--accent-soft)] transition-colors">
              <!-- icon: SignIn -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M11 8l4 4-4 4M15 12H7"/></svg>
            </a>
            <!-- ThemeModeToggle — renders Moon while data-mode="dark" (the default) -->
            <button type="button" data-mockup-theme-toggle aria-label="Light mode" title="Light mode"
                    class="inline-flex items-center justify-center size-8 rounded-full border border-[var(--line-2)] text-[var(--ink-1)] hover:bg-[var(--accent-soft)] transition-colors">
              <!-- icon: Moon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <!-- NavRightStyleWidget -->
            <div class="absolute -right-[20px] top-[8px]">
              <!-- decorative -->
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M0 0L0 20C0 8.95431 8.95431 0 20 0L0 0Z" fill="var(--page-bg)"/></svg>
            </div>
          </div>

        </div>
      </div>
    </div>
  </header>

  <!-- LAYOUT.wrapper -->
  <div class="relative isolate flex min-h-svh w-full max-lg:flex-col">

    <!-- LAYOUT.wrapper2 -->
    <div class="flex-1 flex items-start flex-col items-stretch max-w-full min-h-screen">

      <!-- LAYOUT.wrapper3 -->
      <div class="flex flex-1 items-start">

        <!-- LAYOUT.childWrapper · single-column collapse for auth -->
        <div class="flex-1 flex flex-col md:grid md:grid-cols-2">

          <!-- ============================================================
               LAYOUTGROUP · content (auth variant — centred)
               `place-content-center` is added so the form lands centred
               vertically inside the available space. `max-w-md mx-auto`
               constrains the inner shell horizontally.
               ============================================================ -->
          <div data-dms-group="content"
               class="md:col-span-2 w-full flex-1 flex flex-row p-2 place-content-center">
            <div class="flex flex-1 w-full flex-col relative text-[color:var(--ink-1)] text-md font-light leading-7 p-4 min-h-[200px] max-w-md mx-auto justify-center">

              <!-- ============================================================
                   SECTION · lexical:hero — centred header
                   ============================================================ -->
              <section data-dms-section="lexical:hero" class="pt-12 pb-8 text-center">
                <div class="font-[family-name:var(--font-mono)] text-[11px] tracking-[0.16em] uppercase text-[color:var(--ink-3)] mb-6">
                  WCDB · 90.9 FM · SUNY Albany
                </div>
                <h1 class="font-[family-name:var(--font-display)] italic
                           text-[48px] leading-[1.0] tracking-[-0.03em]
                           text-[color:var(--ink-1)] m-0">
                  Studio access.
                </h1>
                <p class="mt-4 font-[family-name:var(--font-sans)] text-[15px] leading-[1.4] tracking-[-0.01em] text-[color:var(--ink-2)] max-w-[320px] mx-auto">
                  Sign in to manage your show, post spins, and edit the
                  schedule.
                </p>
              </section>

              <!-- ============================================================
                   SECTION · card:login-form — centred form card
                   ============================================================ -->
              <section data-dms-section="card:login-form" class="mb-8">
                <div class="rounded-[18px] bg-[var(--card-bg)] p-8">

                  <form class="flex flex-col gap-4">

                    <!-- Email -->
                    <label class="flex flex-col gap-2">
                      <span class="font-[family-name:var(--font-mono)] text-[11px] tracking-[0.12em] uppercase text-[color:var(--ink-3)]">Email</span>
                      <input type="email"
                             placeholder="dj@albany.edu"
                             class="w-full appearance-none rounded-[8px] border border-[var(--line-2)] bg-[var(--bg-2)] px-[14px] py-[12px] font-[family-name:var(--font-sans)] text-[14px] text-[color:var(--ink-1)] placeholder:text-[color:var(--ink-4)] outline-none transition-colors duration-150 focus:border-[color:var(--ink-3)]">
                    </label>

                    <!-- Password -->
                    <label class="flex flex-col gap-2">
                      <span class="font-[family-name:var(--font-mono)] text-[11px] tracking-[0.12em] uppercase text-[color:var(--ink-3)]">Password</span>
                      <input type="password"
                             placeholder="••••••••••"
                             class="w-full appearance-none rounded-[8px] border border-[var(--line-2)] bg-[var(--bg-2)] px-[14px] py-[12px] font-[family-name:var(--font-sans)] text-[14px] text-[color:var(--ink-1)] placeholder:text-[color:var(--ink-4)] outline-none transition-colors duration-150 focus:border-[color:var(--ink-3)]">
                    </label>

                    <!-- Remember + Forgot -->
                    <div class="flex items-center justify-between pt-1">
                      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                        <span class="relative inline-block w-9 h-5 rounded-full bg-[var(--bg-3)] ring-1 ring-[var(--line-2)] transition-colors">
                          <span class="absolute left-0.5 top-0.5 size-4 rounded-full bg-[var(--ink-3)] transition-transform"></span>
                        </span>
                        <span class="font-[family-name:var(--font-sans)] text-[12px] leading-[1.45] tracking-[-0.01em] text-[color:var(--ink-2)]">Remember me</span>
                      </label>
                      <a class="font-[family-name:var(--font-mono)] text-[11px] tracking-[0.12em] uppercase text-[color:var(--ink-3)] hover:text-[color:var(--ink-1)]">Forgot password</a>
                    </div>

                    <!-- Sign in button -->
                    <button type="submit"
                            class="mt-3 w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full
                                   bg-[color:var(--ink-1)] text-[color:var(--page-bg)]
                                   font-[family-name:var(--font-sans)] text-[14px] font-medium
                                   hover:scale-[1.01] active:scale-100 transition-transform">
                      Sign in
                      <!-- icon: ArrowRight -->
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
                    </button>

                    <!-- Divider -->
                    <div class="flex items-center gap-3 my-2">
                      <div class="flex-1 wcdb-hairline"></div>
                      <span class="font-[family-name:var(--font-mono)] text-[10px] tracking-[0.12em] uppercase text-[color:var(--ink-4)]">or</span>
                      <div class="flex-1 wcdb-hairline"></div>
                    </div>

                    <!-- SSO -->
                    <button type="button"
                            class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full
                                   border border-[var(--line-3)] text-[color:var(--ink-1)] hover:bg-[var(--accent-soft)]
                                   font-[family-name:var(--font-sans)] text-[13px] font-medium transition-colors">
                      Continue with SUNY SSO
                      <!-- icon: ArrowRight -->
                      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
                    </button>
                  </form>

                  <!-- Footer link -->
                  <div class="mt-7 pt-5 border-t border-[var(--line-1)] text-center">
                    <a class="font-[family-name:var(--font-sans)] text-[13px] text-[color:var(--ink-2)] hover:text-[color:var(--ink-1)]">
                      New here?
                      <span class="text-[color:var(--ink-1)] border-b border-[var(--line-2)] pb-0.5 ml-1">Request studio access</span>
                    </a>
                  </div>
                </div>
              </section>

              <!-- ============================================================
                   SECTION · card:footer-meta — small metaXS row.
                   No big inverted footer on auth pages.
                   ============================================================ -->
              <section data-dms-section="card:footer-meta" class="pb-12 text-center">
                <div class="font-[family-name:var(--font-mono)] text-[11px] tracking-[0.12em] uppercase text-[color:var(--ink-4)] inline-flex items-center gap-3">
                  <a class="hover:text-[color:var(--ink-2)]">Privacy</a>
                  <span aria-hidden="true">·</span>
                  <a class="hover:text-[color:var(--ink-2)]">Terms</a>
                  <span aria-hidden="true">·</span>
                  <span>© 1977–2026 WCDB</span>
                </div>
              </section>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mockup runtime (theme toggle + on-air photo rotation). Dev scaffolding only. -->
<script src="../mockup.js"></script>

<!-- Shared, section-contextual nav widget (skill §7.0.2). Dev scaffolding only. -->
<script src="../ds-nav.js"></script>

</body>
</html>
